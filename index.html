<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: #ffffff;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 400px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #00c853, #69f0ae);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .checkmark {
            width: 32px;
            height: 32px;
            position: relative;
        }

        .checkmark::before,
        .checkmark::after {
            content: '';
            position: absolute;
            background: white;
        }

        .checkmark::before {
            width: 3px;
            height: 16px;
            transform: rotate(45deg);
            right: 12px;
            top: 4px;
        }

        .checkmark::after {
            width: 3px;
            height: 24px;
            transform: rotate(-45deg);
            right: 22px;
            top: 0;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(90deg, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #b3b3b3;
            font-size: 1.1rem;
        }

        .button {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(45deg, #7c4dff, #448aff);
            border: none;
            border-radius: 2rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 77, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <div class="checkmark"></div>
        </div>
        <h1>Payment Details Saved</h1>
        <p>Your payment information has been securely stored for future transactions. You can now proceed with faster checkouts.</p>
        <a href="#" class="button">Continue Shopping</a>
    </div>
</body>
</html>
